---
# playbook.yml - Instala e configura o Docker Engine na VM criada pelo Vagrant

- name: Instalar e configurar o Docker Engine
  hosts: all
  become: true

  tasks:
    - name: Atualizar cache de pacotes
      apt:
        update_cache: true

    - name: Instalar dependências
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Criar diretório para chaves GPG
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Adicionar chave GPG oficial do Docker
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Adicionar repositório oficial do Docker
      apt_repository:
        repo: "deb [arch={{ ansible_architecture }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
        filename: docker

    - name: Instalar Docker Engine e plugins
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Garantir que o serviço Docker está ativo e habilitado
      service:
        name: docker
        state: started
        enabled: true

    - name: Adicionar usuário vagrant ao grupo docker
      user:
        name: vagrant
        groups: docker
        append: true

    - name: Testar instalação rodando hello-world
      command: docker run hello-world
      register: docker_test
      changed_when: false

    - name: Exibir resultado do teste
      debug:
        var: docker_test.stdout
